    if (!board.usb && Date.now() - board.lastUsbTry > 10000) {
      board.lastUsbTry = Date.now();
      board.usb = findUsb();
      if (!board.usb) board.dump = 'JB OK but no USB mounted (/mnt/usb0-3/vue_debug.txt)';
      renderSalida();
    }
    if (board.usb) dumpKernel(board.usb);
  }, 700);
})();

  } catch (e) { showErr((e && e.stack) || String(e)) }
  // ---- end theme ----

  }
  K(14)                      // RUN USERLAND

  jsmaf.kbase = new BigInt(0xffffffff, 0x80200000)
  

  // scale to the window
  var box = document.getElementById('box')
  function fit () {
    var s = Math.min(1, (window.innerWidth - 44) / 1920, (window.innerHeight - 44) / 1080)
    screen.style.transform = 'scale(' + s + ')'
    box.style.width = (1920 * s) + 'px'
    box.style.height = (1080 * s) + 'px'
