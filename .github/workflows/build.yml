name: Build and Release

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches: [main, debug-blackboard]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Check include graph (non-blocking)
        run: |
          MISSING=""
          for f in dist/download0/*.js; do
            base=$(basename "$f")
            if ! grep -rqF "'$base'" dist/download0 --include='*.js'; then
              MISSING="$MISSING $base"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::warning::JS sin include estático:$MISSING (link error en runtime)"
          fi

      - name: Check mojibake (non-blocking)
        run: |
          if grep -rnP 'â€|â†|Ã|Â|ï¿½' src --include='*.ts' --include='*.md' --include='*.json' > /tmp/moji.txt 2>/dev/null; then
            echo "::warning::mojibake detectado (texto UTF-8 mal decodificado)"
            head -20 /tmp/moji.txt
          fi

      - name: Replace version strings
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="${{ github.event_name == 'release' && github.ref_name || '1.4' }}"
          find ./dist -type f -name '*.js' -exec sed -i "s/%VERSION_STRING%/${SHORT_SHA}/g" {} +
          find ./dist -type f -name '*.js' -exec sed -i "s/%VERSION_TAG%/${TAG}/g" {} +

      - name: Copy assets to dist
        run: |
          cp src/download0/payloads/*.elf dist/download0/payloads/
          cp src/download0/payloads/*.bin dist/download0/payloads/
          # GoldHEN auto-load: ship it as download0/payload.bin so binloader
          # (which checks /mnt/sandbox/download/CUSA00960/payload.bin first) loads it before /data.
          cp src/download0/payload.bin dist/download0/
          cp -r src/download0/img dist/download0/
          cp -r src/download0/sfx dist/download0/
          cp -r src/download0/vid dist/download0/
          cp src/download0/*.aes dist/download0/
          cp src/download0/config.json dist/download0/

      - name: Check ftp/updater.js sync (non-blocking)
        run: |
          if ! diff <(tr -d '[:space:]' < ftp/updater.js) <(tr -d '[:space:]' < dist/download0/payloads/updater.js) > /dev/null 2>&1; then
            echo "::warning::ftp/updater.js is out of sync with dist/download0/payloads/updater.js - regenerate it (cp dist/download0/payloads/updater.js ftp/updater.js)"
          fi

      - name: Generate manifest
        run: |
          cd dist/download0
          find . -type f | sed 's|^\./||' | sort > manifest.txt

      - name: Encrypt savedata
        run: |
          pip install cryptography
          python src/tools/encrypt_aes_files.py src/savedata/localstorage
          mkdir -p dist/savedata
          cp src/savedata/localstorage.aes dist/savedata/

      - name: Build lite variant
        run: |
          mkdir -p dist-lite/download0
          mkdir -p dist-lite/download0/themes/default
          

          # Core runtime JS
          for f in serve.js.aes dummy_psn.json.aes loader.js userland.js types.js kernel.js \
                   lapse.js netctrl_c0w_twins.js relapse.js binloader.js check-jailbroken.js defs.js; do
            cp dist/download0/$f dist-lite/download0/
            
          done

          # Hardcoded lite config - auto detect, auto close, no music, no menu
          printf '{
              "config": {
                  "autolapse": true,
                  "autopoop": false,
                  "autorelapse": false,
                  "autoclose": true,
                  "autoclose_delay": 20000,
                  "autogoldhen": true,
                  "music": false,
                  "jb_behavior": 0
              },
              "payloads": []
          }' > dist-lite/download0/config.json

          # Generate lite manifest
          cd dist-lite/download0
          find . -type f | sed 's|^\./||' | sort > manifest.txt
          cd ../..

          # Copy savedata
          cp -r dist/savedata dist-lite/savedata 2>/dev/null || true

      - name: Zip dist
        run: cd dist && zip -r ../vue-after-free-${{ github.ref_name }}.zip download0/ savedata/ && cd ..

      - name: Zip lite dist
        run: cd dist-lite && zip -r ../vue-after-free-lite-${{ github.ref_name }}.zip download0/ savedata/ && cd ..

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vue-after-free-${{ github.ref_name }}
          path: vue-after-free-${{ github.ref_name }}.zip

      - name: Upload lite dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-lite
          path: dist-lite/

      - name: Upload lite build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vue-after-free-lite-${{ github.ref_name }}
          path: vue-after-free-lite-${{ github.ref_name }}.zip

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vue-after-free-${{ github.ref_name }}.zip
            vue-after-free-lite-${{ github.ref_name }}.zip

  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
  ufs-image:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create UFS2 image in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          copyback: true
          prepare: ""
          run: |
            set -e

            # Create 256MB image file
            truncate -s 256M download0.dat

            # Attach as memory disk (returns e.g. "md0")
            MD=$(mdconfig -a -t vnode -f "$(pwd)/download0.dat")

            # Create UFS2 filesystem
            newfs -O 2 -b 32768 -f 4096 /dev/${MD}

            # Mount
            mount /dev/${MD} /mnt

            # Copy dist contents
            cp -R dist/download0/* /mnt/

            # Create empty dirs
            mkdir -p /mnt/mgl /mnt/video_cache /mnt/xhr_cache

            # Set permissions
            chmod -R 777 /mnt/*

            # Unmount and detach
            umount /mnt
            mdconfig -d -u ${MD}

      - name: Verify image
        run: file download0.dat

      - name: Zip UFS2 image
        run: zip download0_dat_uf2.zip download0.dat

      - name: Upload UFS2 image artifact
        uses: actions/upload-artifact@v4
        with:
          name: download0_dat_uf2.zip
          path: download0_dat_uf2.zip

      - name: Delete dist artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: dist

      - name: Upload UFS2 release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: download0_dat_uf2.zip

  ufs-image-lite:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download lite dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-lite
          path: dist-lite/

      - name: Create lite UFS2 image in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          copyback: true
          prepare: ""
          run: |
            set -e

            # Create 256MB image file
            truncate -s 256M download0.dat

            # Attach as memory disk
            MD=$(mdconfig -a -t vnode -f "$(pwd)/download0.dat")

            # Create UFS2 filesystem
            newfs -O 2 -b 32768 -f 4096 /dev/${MD}

            # Mount
            mount /dev/${MD} /mnt

            # Copy lite dist contents
            cp -R dist-lite/download0/* /mnt/

            # Create empty dirs
            mkdir -p /mnt/mgl /mnt/video_cache /mnt/xhr_cache

            # Set permissions
            chmod -R 777 /mnt/*

            # Unmount and detach
            umount /mnt
            mdconfig -d -u ${MD}

      - name: Verify image
        run: file download0.dat

      - name: Zip lite UFS2 image
        run: zip download0_dat_lite.zip download0.dat

      - name: Upload lite UFS2 image artifact
        uses: actions/upload-artifact@v4
        with:
          name: download0_dat_lite
          path: download0_dat_lite.zip

      - name: Delete lite dist artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: dist-lite

      - name: Upload lite UFS2 release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: download0_dat_lite.zip
